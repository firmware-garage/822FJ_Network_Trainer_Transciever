; Cluster trainer, ESP32-S3 port.
; Default env: ESP32-S3 Super Mini (ESP32-S3FH4R2: 4 MB flash, 2 MB PSRAM in package).
; Second env: ESP32-S3 DevKitC-1 N16R8 style boards. Both use the same pins.

[platformio]
default_envs = s3_supermini

[env]
; pioarduino platform, Arduino-ESP32 core 3.3.x (the classic build used core 2.0.x)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
lib_deps =
    marcoschwartz/LiquidCrystal_I2C@^1.1.4
; J1850 VPW library is vendored in lib/J1850VPW_ESP32 (VoodooMods fork, 3 small patches)
build_flags =
    -Wall
    ; Time from releasing TX to the first "did RX follow us?" check, in us.
    ; Upstream is 10. Your class2_sniffer v2 found the RX transistor releases
    ; late and compensates 25 us by default (measure yours with "hist").
    ; At 10 us the library would see its own late release as lost arbitration.
    ; 40 = 25 us lag + 15 us margin, leaving the last 24 us of a short passive
    ; symbol for the real arbitration check. Tune on the bench: arbLost
    ; climbing on a quiet bus = raise it (max 49).
    -DPROPOGATION_DELAY=40

[env:s3_supermini]
board = esp32-s3-fh4r2
build_flags =
    ${env.build_flags}
    ; Serial on the USB-C port through the S3's built-in USB serial/JTAG
    ; (the board file already turns CDC on boot on; this picks HW CDC over TinyUSB)
    -DARDUINO_USB_MODE=1

[env:s3_n16r8]
board = esp32-s3-devkitc1-n16r8
build_flags =
    ${env.build_flags}
    ; Serial on the port marked USB (native). Remove both lines to use the UART port.
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
